name: Deploy to Hugging Face Spaces

# Mirrors the repo to a Docker Space, which builds the root Dockerfile.
# Setup once:
#   1. Create a Space (SDK: Docker) at huggingface.co/new-space
#   2. Repo secrets: HF_TOKEN (write token), and variable HF_SPACE (e.g. user/voice-hr)
#   3. In the Space settings add secrets: DATABASE_URL, JWT_SECRET, GROQ_API_KEY

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Spaces read their config from README front matter.
          cp deploy/huggingface/README.md README.md
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git commit -am "Space config" --allow-empty
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${{ vars.HF_SPACE }}" HEAD:main
