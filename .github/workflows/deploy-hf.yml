name: Deploy to Hugging Face Spaces

# Uploads the app to a Docker Space after CI passes on main; the Space builds
# the root Dockerfile. Secrets (DATABASE_URL, GROQ_API_KEY, JWT_SECRET) live in
# the Space settings and are set once with deploy/huggingface/deploy.py.
#
# Repo setup: secret HF_TOKEN (write token) and variable HF_SPACE (user/space).

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python deploy/huggingface/deploy.py --space "${{ vars.HF_SPACE }}"
          --message "Deploy ${{ github.sha }}"
