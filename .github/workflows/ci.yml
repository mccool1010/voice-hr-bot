name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, migrate, test, train
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voicehr
          POSTGRES_PASSWORD: voicehr_ci
          POSTGRES_DB: voicehr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voicehr"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: voicehr_ci
      LLM_PROVIDER: echo
      SPEECH_ENABLED: "false"
      EMBEDDINGS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install (CPU PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Lint and typecheck
        run: |
          ruff check app ml tests
          ruff format --check app ml tests
          mypy app

      - name: Migrations round-trip on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing:skip-covered

      - name: ML pipeline smoke test
        # Small run: proves generate → extract → train → checkpoint still works.
        run: |
          python -m ml.generate_dataset --rows 1500 --out ml/data/ci.jsonl
          python -m ml.train_scorer --data ml/data/ci.jsonl --epochs 15 --out ml/artifacts/ci.pt
          python -c "from pathlib import Path; from app.scoring.model import load_scorer; load_scorer(Path('ml/artifacts/ci.pt')); print('checkpoint loads')"

  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Deploy image builds
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: voice-hr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
